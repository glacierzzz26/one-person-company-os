<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一人公司 OS 控制台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f6f8fb; --line:#e2e8f1; --line-2:#cfd8e5;
  --text:#1c2430; --text-2:#5c6b7f; --text-3:#8d99aa;
  --accent:#2f54eb; --accent-hi:#2447d0; --accent-soft:#eaefff; --accent-line:#c3cfff;
  --ok:#1a9e65; --ok-soft:#e5f6ee; --warn:#c9861a; --warn-soft:#faf1df; --crit:#d43b52; --crit-soft:#fbe9ec; --info:#2f54eb;
  --side-bg:#141a26; --side-bg2:#101725; --side-text:#aebaca; --side-text-hi:#f0f4fa;
  --shadow:0 1px 2px rgba(28,36,48,.06),0 4px 14px rgba(28,36,48,.07);
  --r:8px; --r-sm:6px;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131c; --surface:#161d29; --surface-2:#1b2431; --line:#26303f; --line-2:#33405399;
    --text:#e6ebf2; --text-2:#9aabbe; --text-3:#6b7a8e;
    --accent:#6a83ff; --accent-hi:#8397ff; --accent-soft:#1d2547; --accent-line:#33418f;
    --ok:#3cb782; --ok-soft:#13301f; --warn:#dca845; --warn-soft:#33270f; --crit:#ea6f82; --crit-soft:#3a1620;
    --side-bg:#0b1018; --side-bg2:#090d13; --side-text:#8fa0b5; --side-text-hi:#eef3fa;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131c; --surface:#161d29; --surface-2:#1b2431; --line:#26303f; --line-2:#33405399;
  --text:#e6ebf2; --text-2:#9aabbe; --text-3:#6b7a8e;
  --accent:#6a83ff; --accent-hi:#8397ff; --accent-soft:#1d2547; --accent-line:#33418f;
  --ok:#3cb782; --ok-soft:#13301f; --warn:#dca845; --warn-soft:#33270f; --crit:#ea6f82; --crit-soft:#3a1620;
  --side-bg:#0b1018; --side-bg2:#090d13; --side-text:#8fa0b5; --side-text-hi:#eef3fa;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:400 14px/1.6 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center}
.gap6{gap:6px}.gap8{gap:8px}.gap12{gap:12px}
.grow{flex:1}
.muted{color:var(--text-2)}.dim{color:var(--text-3)}
/* ============ shell ============ */
.shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--side-bg),var(--side-bg2));color:var(--side-text);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:18px 18px 14px;display:flex;gap:10px;align-items:center}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;box-shadow:0 3px 10px rgba(47,84,235,.4)}
.brand b{display:block;color:var(--side-text-hi);font-size:15px;letter-spacing:.3px}
.brand span{font-size:11px;font-family:var(--mono);color:var(--side-text);opacity:.8}
.nav{padding:6px 10px 14px;flex:1}
.nav .grp{margin:16px 8px 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.55}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  color:var(--side-text);text-decoration:none;font-size:13.5px;margin:1px 0;position:relative}
.nav a svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;opacity:.85}
.nav a:hover{background:#ffffff12;color:var(--side-text-hi)}
.nav a.on{background:var(--accent);color:#fff}
.nav a.on svg{opacity:1}
.nav .cnt{margin-left:auto;font:500 11px/16px var(--mono);background:#d43b52;color:#fff;
  border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.nav a:not(.on) .cnt{background:var(--crit)}
.side-foot{padding:12px 16px;border-top:1px solid #ffffff14;font:11px/1.7 var(--mono);opacity:.75}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  padding:0 24px;height:56px;display:flex;align-items:center;gap:14px}
.company-pick{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--surface-2);font-weight:500}
.company-pick select{border:0;background:transparent;font:inherit;outline:none;cursor:pointer}
.pill-auth{display:inline-flex;align-items:center;gap:6px;font:11px/1 var(--mono);
  border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:var(--text-2)}
.pill-auth i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.iconbtn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.content{padding:22px 24px 40px;max-width:1360px;width:100%}
.page-head{display:flex;align-items:flex-end;gap:12px;margin:2px 0 16px}
.page-head h1{margin:0;font-size:21px;letter-spacing:.2px}
.page-head .sub{font-size:12px;color:var(--text-3);font-family:var(--mono)}
.page-head .acts{margin-left:auto;display:flex;gap:8px}
.demo-chip{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:500}
/* ============ buttons ============ */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--text);border-radius:var(--r-sm);padding:6px 13px;font-size:13px;font-weight:500;
  transition:all .15s ease;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hi)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.danger:hover{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* ============ cards ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.card .hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card .hd h3{margin:0;font-size:14.5px;font-weight:700;letter-spacing:.2px}
.card .hd .api{margin-left:auto;font:10.5px/1 var(--mono);color:var(--text-3);background:var(--surface-2);
  border:1px solid var(--line);border-radius:4px;padding:4px 7px;white-space:nowrap}
.card .bd{padding:14px 16px}
.card .bd.p0{padding:0}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:minmax(0,1fr) minmax(0,360px)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .k{font-size:12px;color:var(--text-2)}
.tile .v{font:700 26px/1.2 var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.tile .x{font-size:11.5px;color:var(--text-3);margin-top:1px}
.tile.hot{border-color:var(--crit)}
.tile.hot::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--crit)}
.tile.warned{border-color:var(--warn)}
.tile.warned::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}
/* ============ pills / status ============ */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.p-gray{background:var(--surface-2);color:var(--text-2);border:1px solid var(--line)}
.p-blue{background:var(--accent-soft);color:var(--accent)}
.p-green{background:var(--ok-soft);color:var(--ok)}
.p-amber{background:var(--warn-soft);color:var(--warn)}
.p-red{background:var(--crit-soft);color:var(--crit)}
.risk-low{color:var(--text-3)}.risk-medium{color:var(--warn)}.risk-high{color:var(--crit);font-weight:700}
.tag{font:11px/1.5 var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--text-2)}
/* ============ bars ============ */
.stackbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.stackbar div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:12px;color:var(--text-2)}
.legend b{font-family:var(--mono);font-weight:700;color:var(--text)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.minibar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.minibar div{height:100%;background:var(--accent)}
/* ============ tables ============ */
.tblwrap{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-weight:500;color:var(--text-2);font-size:12px;padding:9px 12px;
  border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tb td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tbody tr.click{cursor:pointer}
.tb tbody tr.click:hover td{background:var(--surface-2)}
.tb .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tb .idcell{font:11px var(--mono);color:var(--text-3)}
.tb .t-title{font-weight:500}
.tb .t-sub{font-size:11.5px;color:var(--text-3);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ============ lists ============ */
.list{display:flex;flex-direction:column}
.list .item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.item .meta{font-size:12px;color:var(--text-3);margin-top:1px}
.fuse{border-left:3px solid var(--crit)}
.fuse .t-title b{color:var(--crit)}
.empty{padding:26px;text-align:center;color:var(--text-3);font-size:13px}
.empty svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5;display:block;margin:0 auto 8px;opacity:.5}
/* ============ approvals page ============ */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{padding:5px 13px;font-size:12.5px;color:var(--text-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);border-radius:99px;padding:3px 12px;font-size:12.5px;color:var(--text-2);background:var(--surface)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:500}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:6px 11px;background:var(--surface);min-width:240px}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;outline:none;background:transparent;flex:1;font-size:13px}
.search svg{width:15px;height:15px;stroke:var(--text-3);fill:none;stroke-width:2}
/* ============ drawer / modal ============ */
.veil{position:fixed;inset:0;background:rgba(10,14,22,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.veil.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,92vw);background:var(--surface);z-index:70;
  transform:translateX(103%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(10,14,22,.25)}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .dbody{flex:1;overflow:auto;padding:18px 20px}
.kv{display:grid;grid-template-columns:112px 1fr;gap:7px 14px;font-size:13px;margin-bottom:16px}
.kv dt{color:var(--text-3);font-size:12.5px}
.kv dd{margin:0;word-break:break-all}
.kv dd .mono{font-size:12px}
.sect-h{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin:20px 0 10px;font-weight:700}
.timeline{position:relative;padding-left:16px}
.timeline::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tl-i{position:relative;padding:0 0 14px 6px}
.tl-i::before{content:"";position:absolute;left:-16px;top:6px;width:9px;height:9px;border-radius:50%;
  background:var(--surface);border:2px solid var(--accent)}
.tl-i.ok::before{border-color:var(--ok)} .tl-i.bad::before{border-color:var(--crit)}
.tl-i .tt{font-size:13px;font-weight:500}
.tl-i .tm{font:11px var(--mono);color:var(--text-3)}
.tl-i .terr{font-size:12px;color:var(--crit);background:var(--crit-soft);border-radius:5px;padding:4px 8px;margin-top:4px;font-family:var(--mono)}
.drawer .dfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:20px}
.modal.open{display:grid}
.modal .box{width:min(460px,94vw);background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 20px 60px rgba(10,14,22,.35);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.modal .mh{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.modal .mh .x{margin-left:auto}
.modal .mb{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal .mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.f label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:5px;font-weight:500}
.f input[type=text],.f textarea,.f select{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);
  background:var(--surface);padding:7px 10px;outline:none;font-size:13px}
.f textarea{resize:vertical;min-height:74px}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--accent)}
.f .hint{font-size:11.5px;color:var(--text-3);margin-top:4px}
.dec-seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.dec-seg label{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 6px;text-align:center;cursor:pointer;font-size:13px}
.dec-seg input{position:absolute;opacity:0;pointer-events:none}
.dec-seg label small{display:block;font-size:11px;color:var(--text-3);font-weight:400}
.dec-seg label.sel-a{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.dec-seg label.sel-r{border-color:var(--crit);background:var(--crit-soft);color:var(--crit);font-weight:700}
.dec-seg label.sel-c{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.note-cli{font-size:12px;color:var(--text-2);background:var(--surface-2);border:1px dashed var(--line-2);
  border-radius:var(--r-sm);padding:9px 12px;display:flex;gap:8px;align-items:flex-start}
.note-cli code{font:11px var(--mono);color:var(--accent)}
/* ============ toast ============ */
.toasts{position:fixed;right:20px;bottom:20px;z-index:99;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--r-sm);box-shadow:var(--shadow);padding:10px 14px;font-size:13px;max-width:360px;
  display:flex;gap:9px;align-items:flex-start;animation:slidein .25s ease}
.toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--crit)}
.toast .tx{font:11px var(--mono);color:var(--text-3);margin-top:2px}
@keyframes slidein{from{transform:translateX(30%);opacity:0}}
/* ============ misc ============ */
.prog{font-size:12.5px;color:var(--text-2);display:flex;gap:10px;align-items:center;margin:4px 0}
.prog .pl{width:110px;flex:none;display:flex;justify-content:space-between}
.prog .pl b{font-family:var(--mono);color:var(--text)}
.prog .bar{flex:1;max-width:220px}
.spin{width:14px;height:14px;border:2px solid var(--accent-line);border-top-color:var(--accent);border-radius:50%;
  animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.model-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.foot-status{border-top:1px solid var(--line);background:var(--surface);margin-top:auto;
  font:11px/1 var(--mono);color:var(--text-3);padding:9px 24px;display:flex;gap:20px}
.foot-status i{color:var(--ok);font-style:normal}
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.mem b{font-size:14px}
.mem p{margin:0;font-size:13px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mem .mfoot{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:6px}
.agent-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:99px;padding:3px 11px 3px 4px;font-size:12.5px}
.agent-chip .av{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font:700 10px var(--mono)}
.cap-line{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line)}
.cap-line:last-child{border-bottom:0}
.cap-line .cc{width:60px;flex:none;font-weight:700;font-size:13px}
.cap-line .code{font:10.5px var(--mono);color:var(--text-3)}
.hl{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 2px}
@media (max-width:1100px){.cols-2{grid-template-columns:1fr}}
@media (max-width:820px){
  .shell{grid-template-columns:64px 1fr}
  .brand b,.brand span,.nav .grp,.nav a span,.side-foot,.pill-auth,.demo-chip{display:none}
  .page-head{flex-wrap:wrap}
  .nav a{justify-content:center;padding:10px}
  .nav .cnt{position:absolute;top:4px;right:8px;margin:0}
  .content{padding:16px}
  .top{padding:0 14px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <!-- ================= sidebar ================= -->
  <aside class="side">
    <div class="brand">
      <div class="mark">OS</div>
      <div><b>一人公司 OS</b><span>ops console · 7.2</span></div>
    </div>

function toast(msg,kind,extra){const el=document.createElement("div");el.className="toast"+(kind?" "+kind:"");

function mountSpark(){
  const host=$("#spark");if(!host)return;
  const d=data.overview.done_7d,W=70,H=22,mx=Math.max(...d);
  const pts=d.map((v,i)=>[i/(d.length-1)*W,H-v/mx*(H-3)-1]);
  const line=pts.map(p=>p.join(",")).join(" ");
  host.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <polyline points="0,${H} ${line} ${W},${H}" fill="var(--accent-soft)" stroke="none"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="2.2" fill="var(--accent)"/></svg>`;
}
/* ================= 抽屉 & 弹窗 ================= */
function openDrawer(title,html,foot){$("#dr-title").textContent=title;$("#dr-body").innerHTML=html;$("#dr-foot").innerHTML=foot||"";$("#dr-foot").style.display=foot?"flex":"none";$("#drawer").classList.add("open");$("#veil").classList.add("open")}
function openModal(title,html,foot){$("#md-title").textContent=title;$("#md-body").innerHTML=html;$("#md-foot").innerHTML=foot||"";$("#modal").classList.add("open");const fi=$("#md-body").querySelector("input:not([type=radio]),textarea,select");fi&&fi.focus()}
function closeAll(){$("#drawer").classList.remove("open");$("#modal").classList.remove("open");$("#veil").classList.remove("open")}
$("#veil").addEventListener("click",closeAll);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});
document.addEventListener("click",e=>{if(e.target.closest("[data-close]"))closeAll()});
/* ================= 任务详情 ================= */
function taskDrawer(id){
  const t=data.tasks.find(x=>x.id===id);if(!t)return;
  const execs=data.executions[id]||[];
  const kv=[["ID",`<span class="mono">${t.id}</span>`],["工具",`<span class="tag">${t.tool_name}</span>`],["状态",stPill(t.status)],["队列",`<span class="mono" style="font-size:12px">${t.q_status}</span>`],
    ["风险",riskPill(t.risk)],["回合 / 冲突",`<span class="mono">${t.round_no} / <b style="color:${t.conflict_count>=3?"var(--crit)":"inherit"}">${t.conflict_count}</b></span>`],
    ["Capability",t.capability_id?data.capabilities.find(c=>c.id===t.capability_id).name:"—"],["父任务",t.parent_task_id?`<a href="#" data-task="${t.parent_task_id}" style="color:var(--accent)">↩ ${t.parent_task_id}</a>`:"—"],
    ["创建 / 更新",`<span class="mono" style="font-size:12px">${fmtT(t.created_at)} / ${fmtT(t.updated_at)}</span>`]];
  if(t.last_error)kv.push(["最后错误",`<span class="mono" style="color:var(--crit);font-size:12px">${esc(t.last_error)}</span>`]);
  if(t.result)kv.push(["结果",esc(t.result)]);
  const tl=execs.length?`<div class="sect-h">执行回合</div><div class="timeline">${execs.map(x=>`
    <div class="tl-i ${x.status==="failed"?"bad":x.status==="succeeded"?"ok":""}">
      <div class="tt">第 ${x.attempt} 次 · <span class="pill ${x.status==="failed"?"p-red":"p-green"}" style="font-size:10px">${x.status}</span> <span class="tag">${x.worker}</span></div>
      <div class="tm">${fmtT(x.started_at)} → ${fmtT(x.finished_at)} · ${Math.round((x.finished_at-x.started_at)/MIN)}min</div>
      ${x.result?`<div class="muted" style="font-size:12.5px;margin-top:3px">${esc(x.result)}</div>`:""}
      ${x.error?`<div class="terr">✗ ${esc(x.error)}</div>`:""}</div>`).join("")}</div>`
    :`<div class="sect-h">执行回合</div><div class="dim" style="font-size:12.5px">暂无执行记录(GET /tasks/${t.id}/executions)</div>`;
  const ap=data.approvals.find(a=>a.task_id===t.id&&a.status==="pending");
  openDrawer(t.title,`
    <div class="muted" style="font-size:13px;margin-bottom:14px">${esc(t.description)}</div>
    <dl class="kv">${kv.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>${tl}
    <div class="note-cli" style="margin-top:14px"><span>ⓘ</span><span>API 不暴露执行(长时阻塞,契约 §五 ❌):<code>os task run ${t.id}</code> 单跑,队列由 <code>os queue work</code> 或 server <code>--queue-work</code> 认领</span></div>`,
    ap?`<button class="btn primary grow" style="justify-content:center" data-decide="${ap.id}">处理该任务的审批(${short(ap.id)}) →</button>`:"");
}
/* ================= 审批决策 ================= */
function apprDrawer(id){
  const a=data.approvals.find(x=>x.id===id);if(!a)return;
  const stP=a.status==="pending"?stPill("waiting_approval"):`<span class="pill ${a.status==="approved"?"p-green":a.status==="rejected"?"p-red":"p-blue"}">${{approved:"已放行",rejected:"已驳回",changes:"要求修改"}[a.status]}</span>`;
  openDrawer(a.task_title,`<dl class="kv">
    <dt>审批 ID</dt><dd class="mono" style="font-size:12px">${a.id}</dd>
    <dt>关联任务</dt><dd><a href="#" data-task="${a.task_id}" style="color:var(--accent)">↩ ${esc(a.task_title)}</a></dd>
    <dt>风险</dt><dd>${riskPill(a.risk)}</dd>
    <dt>原因</dt><dd class="mono" style="font-size:12px">${esc(a.reason)}</dd>
    <dt>请求方</dt><dd class="mono" style="font-size:12px">${esc(a.requested_by)}</dd>
    <dt>状态</dt><dd>${stP}</dd>
    <dt>请求时间</dt><dd class="mono" style="font-size:12px">${fmtT(a.created_at)}</dd>
    ${a.decided_at?`<dt>决定</dt><dd class="mono" style="font-size:12px">${esc(a.decided_by)} · ${fmtT(a.decided_at)}</dd><dt>备注</dt><dd>${esc(a.decision_note||"—")}</dd>`:""}</dl>
    ${a.status!=="pending"?'<div class="note-cli" style="margin-top:10px"><span>ⓘ</span><span>审批为终态记录:重复决策会被 service 拒绝("approval already '+a.status+'")</span></div>':""}`,
    a.status==="pending"?`<button class="btn primary grow" style="justify-content:center" data-decide="${a.id}">决策 →</button>`:"");
}
let deciding=null;
function decideModal(id){
  const a=data.approvals.find(x=>x.id===id);if(!a)return;deciding=id;
  openModal("审批决策 · "+a.task_title,`
    <div class="muted" style="font-size:13px">原因:<span class="mono">${esc(a.reason)}</span> · ${riskPill(a.risk)}</div>
    <div class="f"><label>决策</label>
      <div class="dec-seg" id="dseg">
        <label data-d="approve" class="sel-a"><input type="radio" name="d" value="approve" checked>放行<small>任务回队续跑</small></label>
        <label data-d="reject"><input type="radio" name="d" value="reject">驳回<small>任务置 failed</small></label>
        <label data-d="changes"><input type="radio" name="d" value="changes">要修改<small>任务置 failed · 重开建单</small></label>
      </div></div>
    <div class="f"><label for="dnote">备注(随 decision 自动落档)</label><input type="text" id="dnote" placeholder="例:影响可控,先放行"></div>
    <div class="note-cli"><span>ⓘ</span><span>等价 <code>os approval approve|reject|changes ${short(a.id)}</code> → POST /api/v1/approvals/${a.id}/decision(approve→回队续跑;reject / changes→任务置 failed,与 service 同语义)</span></div>`,
    `<button class="btn" data-close>取消</button><button class="btn primary" id="dgo">提交决策</button>`);
  $$("#dseg label").forEach(l=>l.addEventListener("click",()=>{
    $$("#dseg label").forEach(x=>x.classList.remove("sel-a","sel-r","sel-c"));
    l.classList.add({approve:"sel-a",reject:"sel-r",changes:"sel-c"}[l.dataset.d])}));
}
document.addEventListener("click",e=>{
  if(e.target.id==="dgo"){
    const d=$("#dseg input:checked").value, note=$("#dnote").value.trim();
    const a=data.approvals.find(x=>x.id===deciding);if(!a)return;
    if(a.status!=="pending"){toast(`该审批已处理(${a.status}),不可重复决策`,"err","service: approval already "+a.status);return}
    a.status=d==="approve"?"approved":d==="changes"?"changes":"rejected";
    a.decided_at=now;a.decided_by="human:console";a.decision_note=note||null;
    const t=data.tasks.find(x=>x.id===a.task_id);
    const rd=data.overview.rd;
    if(t&&t.status==="waiting_approval"&&rd){rd.by_status.waiting_approval=Math.max(0,(rd.by_status.waiting_approval||1)-1)}
    if(d==="approve"&&t){t.status="pending";t.q_status="ready";t.conflict_count=0;t.round_no=(t.round_no||0)+1;if(rd)rd.by_status.pending=(rd.by_status.pending||0)+1}
    if((d==="reject"||d==="changes")&&t){t.status="failed";t.q_status="dead";t.last_error=d==="reject"?"rejected by human":"changes requested: "+note;if(rd)rd.by_status.failed=(rd.by_status.failed||0)+1}
    if(rd){rd.fused=rd.fused.filter(f=>f.id!==a.task_id);rd.waiting=rd.waiting.filter(f=>f.id!==a.task_id)}
    data.decisions.unshift({id:"d"+(data.decisions.length+1),kind:"approval",title:"审批 "+a.status+": "+a.task_title,status:"made",source:"approval:"+a.id,decided_by:"human:console",body:note||"",created_at:now});
    data.audits.unshift({id:"g"+(data.audits.length+1),entity_type:"approval",entity_id:a.id,action:d,actor:"human:console",detail:note||a.reason,created_at:now});
    closeAll();render();
    const msg=d==="approve"?`已放行:${a.task_title} → 任务回队续跑`:d==="reject"?`已驳回:${a.task_title} → 任务置 failed`:`已打回:${a.task_title} → 任务置 failed(重开请再建单)`;
    toast(msg,"ok","decision(kind=approval) 已自动落档 · source=approval:"+a.id);
  }
});
/* ================= 表单模态:新建任务 / 决策 / 记忆 / 端点 / 仓库 ================= */
function newTaskModal(){openModal("新建工程请求",`
  <div class="f"><label>标题 *</label><input type="text" id="nt-title" placeholder="例:支持导出 PDF"></div>
  <div class="f"><label>描述</label><textarea id="nt-desc" placeholder="写清楚背景 / 验收标准。engineering 工具会由 planner 拆解、driver 回合执行"></textarea></div>
  <div class="row gap8">
    <div class="f grow"><label>工具</label><select id="nt-tool"><option value="engineering">engineering(研发部)</option><option value="file-write">file-write</option><option value="shell">shell</option><option value="git">git</option><option value="aifix">aifix</option></select></div>
    <div class="f grow"><label>风险</label><select id="nt-risk"><option>low</option><option selected>medium</option><option>high(将卡审批门)</option></select></div>
    <div class="f grow"><label>Capability</label><select id="nt-cap"><option value="">—</option>${data.capabilities.map(c=>`<option value="${c.id}">${c.name}</option>`).join("")}</select></div></div>
  <div class="note-cli"><span>ⓘ</span><span>POST /api/v1/tasks → 入队(pending/ready),actor 记 <code>human:console</code>;执行认领两条路:<code>os queue work</code> 或 server <code>--queue-work</code> 自动消费(审计 <code>runtime:server</code>)</span></div>`,
  `<button class="btn" data-close>取消</button><button class="btn primary" id="ntgo">创建并入队</button>`)}
document.addEventListener("click",e=>{
  if(e.target.id==="ntgo"){
    const title=$("#nt-title").value.trim();
    if(!title){toast("缺必填:company_id / title","","400 bad_request");return}
    const risk=$("#nt-risk").value.includes("high")?"high":$("#nt-risk").value;
    const t={id:"t"+(data.tasks.length+1),title,description:$("#nt-desc").value.trim(),tool_name:$("#nt-tool").value,risk,
      status:risk==="high"?"waiting_approval":"pending",q_status:risk==="high"?"waiting_approval":"ready",round_no:0,conflict_count:0,
      capability_id:$("#nt-cap").value||null,workflow_id:null,created_at:now,updated_at:now};
    data.tasks.unshift(t);
    if(risk==="high"){data.approvals.unshift({id:"a"+(data.approvals.length+1),task_id:t.id,task_title:title,risk:"high",reason:"risk=high",status:"pending",requested_by:"system",created_at:now,decided_at:null});data.overview.rd.waiting.push({id:t.id,title,status:"waiting_approval",risk:"high",round:1,conflict:0,reason:"risk=high 审批门"});data.overview.rd.by_status.waiting_approval=(data.overview.rd.by_status.waiting_approval||0)+1}
    else data.overview.rd.by_status.pending++;
    data.overview.rd.total++;
    data.audits.unshift({id:"g"+(data.audits.length+1),entity_type:"task",entity_id:t.id,action:"create",actor:"human:console",detail:title,created_at:now});
    closeAll();go(risk==="high"?"approvals":"tasks");render();
    toast(risk==="high"?"已建单:risk=high → 先过审批门":"已建单入队:等待认领","ok","201 · "+t.id);
  }
  if(e.target.dataset.newdec!==undefined||e.target.closest("[data-newdec]")){
    openModal("记一笔决策",`
      <div class="f"><label>类别</label><select id="nd-kind">${["strategy","approval","engineering","pricing","hiring"].map(k=>`<option>${k}</option>`).join("")}</select></div>
      <div class="f"><label>标题 *</label><input type="text" id="nd-title"></div>
      <div class="f"><label>正文</label><textarea id="nd-body" placeholder="背景 / 备选 / 决定 / 复盘时间"></textarea></div>`,
      `<button class="btn" data-close>取消</button><button class="btn primary" id="ndgo">落档</button>`);
  }
  if(e.target.id==="ndgo"){
    const title=$("#nd-title").value.trim();if(!title){toast("缺必填:title","","400 bad_request");return}
    data.decisions.unshift({id:"d"+(data.decisions.length+1),kind:$("#nd-kind").value,title,status:"made",source:"manual",decided_by:"human:console",body:$("#nd-body").value.trim(),created_at:now});
    data.audits.unshift({id:"g"+(data.audits.length+1),entity_type:"decision",entity_id:"d"+data.decisions.length,action:"create",actor:"human:console",detail:title,created_at:now});
    closeAll();go("decisions");render();toast("决策已落档","ok","201");
  }
  if(e.target.closest("[data-newmem]")){
    openModal("沉淀一条记忆",`
      <div class="f"><label>类型</label><select id="nm-type"><option>lesson</option><option>insight</option><option>playbook</option><option>fact</option></select></div>
      <div class="f"><label>标题 *</label><input type="text" id="nm-title"></div>
      <div class="f"><label>内容</label><textarea id="nm-content"></textarea></div>
      <div class="f"><label>标签(逗号分隔)</label><input type="text" id="nm-tags" placeholder="例:熔断,评审"></div>`,
      `<button class="btn" data-close>取消</button><button class="btn primary" id="nmgo">沉淀</button>`);
  }
  if(e.target.id==="nmgo"){
    const title=$("#nm-title").value.trim();if(!title){toast("缺必填:company_id / title","","400 bad_request");return}
    data.memories.unshift({id:"m"+(data.memories.length+1),type:$("#nm-type").value,title,content:$("#nm-content").value.trim()||"—",source:"console",tags:$("#nm-tags").value.trim()||"未分类",created_at:now});
    data.audits.unshift({id:"g"+(data.audits.length+1),entity_type:"memory",entity_id:"m"+data.memories.length,action:"create",actor:"human:console",detail:title,created_at:now});
    closeAll();go("memories");render();toast("已沉淀进知识库","ok","201");
  }
  if(e.target.closest("[data-newep]")){
    openModal("新增模型端点",`
      <div class="f"><label>名称 *</label><input type="text" id="ne-name" placeholder="例:claude-backup"></div>
      <div class="f"><label>协议</label><select id="ne-proto"><option>auto(域名自动识别厂商)</option><option>anthropic</option><option>openai</option></select>
        <div class="hint">proto 取值 auto|anthropic|openai;auto 时按 Base URL 识别 vendor(anthropic.com / openai.com)</div></div>
      <div class="f"><label>Base URL *</label><input type="text" id="ne-url" placeholder="https://…"></div>
      <div class="f"><label>Token</label><input type="password" id="ne-token" placeholder="AES-GCM 密文落库(enc:v1:),响应永不回明文">
        <div class="hint">留空 = 更新端点不换 token;OS_ENDPOINT_KEY 负责加解密,fail-closed</div></div>`,
      `<button class="btn" data-close>取消</button><button class="btn primary" id="nego">保存</button>`);
  }
  if(e.target.id==="nego"){
    const name=$("#ne-name").value.trim(),url=$("#ne-url").value.trim();
    if(!name||!url){toast("缺必填:name / base_url","","400 bad_request");return}
    const v=/anthropic\.com/i.test(url)?"anthropic":/openai\.com/i.test(url)?"openai":"—";
    data.endpoints.push({id:"ep"+(data.endpoints.length+1),name,proto:$("#ne-proto").value.split("(")[0],vendor:v,base_url:url,selected_model:"",role:"pool",status:"active",has_token:!!$("#ne-token").value,models_cache:[]});
    closeAll();go("endpoints");render();toast("端点已保存(role=pool,active):拉一次模型即可选定","ok","201");

  if(e.target.closest("[data-newrepo]")){
    openModal("登记仓库(通道 B)",`
      <div class="f"><label>名称 *</label><input type="text" id="nr-name"></div>
      <div class="f"><label>Repo URL *</label><input type="text" id="nr-url" placeholder="https://github.com/acme/app"></div>
      <div class="f"><label>Workspace</label><input type="text" id="nr-ws" placeholder="/srv/ws/app"></div>

/* ================= 全局事件路由 ================= */
document.addEventListener("click",e=>{
  const nav=e.target.closest("#nav a[data-v]");if(nav){go(nav.dataset.v);return}
  const d=e.target.closest("[data-decide]");if(d){decideModal(d.dataset.decide);return}
  const goEl=e.target.closest("[data-go]");if(goEl){go(goEl.dataset.go);return}
  const td=e.target.closest("[data-task]");if(td){taskDrawer(td.dataset.task);return}
  const af=e.target.closest("[data-af]");if(af){state.apprFilter=af.dataset.af;render();return}
  const tf=e.target.closest("[data-tf]");if(tf){const [k,v]=tf.dataset.tf.split(":");state.tf[k]=v;render();return}
  const dk=e.target.closest("[data-dk]");if(dk){state.dk=dk.dataset.dk;render();return}
  const mt=e.target.closest("[data-mt]");if(mt){state.mf.type=mt.dataset.mt;render();return}
  const ae=e.target.closest("[data-ae]");if(ae){state.ae=ae.dataset.ae;render();return}
  const nw=e.target.closest("[data-newtask]");if(nw){newTaskModal();return}
  const ms=e.target.closest("[data-models]");if(ms){
    const b=$("#mb-"+ms.dataset.models);b.disabled=true;b.innerHTML='<span class="spin"></span> 拉取中';
    setTimeout(()=>{const ep=data.endpoints.find(x=>x.id===ms.dataset.models);
      b.disabled=false;b.textContent="拉取模型";
      ep.models_cache=ep.models_cache.length?ep.models_cache:["(示例)m-1","m-2","m-3"];ep.status="active";
      toast(`${ep.name}:拉到 ${ep.models_cache.length} 个可用模型`,"ok","POST /endpoints/"+ep.id+"/models");render()},900);return}
  const sel=e.target.closest("[data-select]");if(sel){
    const ep=data.endpoints.find(x=>x.id===sel.dataset.select);if(!ep)return;
    openModal("选择模型 · "+ep.name,`
      <div class="f"><label>模型 *</label><input type="text" id="sm-model" value="${esc(ep.selected_model||"")}" placeholder="例:claude-opus-5">
        ${ep.models_cache.length?`<div class="hint">已缓存:<span style="white-space:normal">${ep.models_cache.map(x=>`<button class="chip" data-mm="${esc(x)}">${esc(x)}</button>`).join(" ")}</span></div>`:'<div class="hint">尚无缓存 → 建议先「拉取模型」;select 不校验模型名,直填亦可</div>'}</div>
      <div class="f"><label>角色(可选,role 取值 pool|planner|standby)</label><select id="sm-role">
        <option value="">不改</option>
        <option value="pool"${ep.role==="pool"?" selected":""}>pool · 通用池</option>
        <option value="planner"${ep.role==="planner"?" selected":""}>planner · 规划(planner 拆解用)</option>
        <option value="standby"${ep.role==="standby"?" selected":""}>standby · 热备</option></select></div>`,
      `<button class="btn" data-close>取消</button><button class="btn primary" id="smgo" data-ep="${ep.id}">选定</button>`);
    return}
  const mm=e.target.closest("[data-mm]");if(mm){$("#sm-model").value=mm.dataset.mm;return}
  if(e.target.id==="smgo"){
    const ep=data.endpoints.find(x=>x.id===e.target.dataset.ep);if(!ep)return;
    const model=$("#sm-model").value.trim();
    if(!model){toast("缺必填:model(选择模型不可空)","","400 bad_request");return}
    const role=$("#sm-role").value;
    ep.selected_model=model;if(role)ep.role=role;ep.status="active";
    data.audits.unshift({id:"g"+(data.audits.length+1),entity_type:"endpoint",entity_id:ep.id,action:"select",actor:"human:console",detail:model+" role="+(role||ep.role),created_at:now});
    closeAll();render();
    toast(`${ep.name} → ${model}${role?"("+role+")":""}`,"ok","POST /endpoints/"+ep.id+"/select");return}
  const ad=e.target.closest("[data-appr]");if(ad){const ap=data.approvals.find(x=>x.id===ad.dataset.appr);if(ap&&ap.status==="pending")decideModal(ap.id);else apprDrawer(ad.dataset.appr);return}
  const rep=e.target.closest("[data-repo]");if(rep){const r=data.repos.find(x=>x.id===rep.dataset.repo);
    openDrawer(r.name,`<dl class="kv"><dt>Repo URL</dt><dd class="mono" style="font-size:12px">${esc(r.repo_url)}</dd>
      <dt>Workspace</dt><dd class="mono" style="font-size:12px">${esc(r.workspace_path)}</dd>
      <dt>Open issues</dt><dd class="mono">${r.issues_open}</dd><dt>最近同步</dt><dd>${fmtT(r.last_sync)}</dd>
      <dt>Webhook</dt><dd class="mono" style="font-size:11.5px">POST /api/webhook/github(events: issues.opened/reopened/edited)</dd></dl>
      <div class="note-cli" style="margin-top:10px"><span>ⓘ</span><span>分诊口径(直接做/合并/跳过/问人)由 triage agent 判定,账本落 <code>issue_sync</code>;改口径去知识库 playbook</span></div>`,"");return}
  const sy=e.target.closest('[data-act="sync"]');if(sy){
    const btn=$("#btn-sync")||sy;const html=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span> 同步中';
    setTimeout(()=>{const L=data.overview.rd.ledger;L.direct_work++;data.overview.rd.ledger_seen++;
      if(btn.isConnected){btn.disabled=false;btn.innerHTML=html}
      toast("通道 B 同步完成:+1 issue → direct_work 建任务入队","ok","POST /intake/sync · issues_seen=1, created_tasks=1");render()},1100);return}
});
/* 搜索输入(不重渲染以保焦点) */
document.addEventListener("input",e=>{
  if(e.target.dataset.tfInput==="q"){state.tf.q=e.target.value;
    // 只重刷表格(保输入焦点)
    const tbl=$("#view").querySelector("table.tb tbody");if(!tbl)return;
    const tmp=document.createElement("div");tmp.innerHTML=views.tasks();
    const nt=tmp.querySelector("table.tb tbody");tbl.innerHTML=nt.innerHTML;return}
  if(e.target.dataset.mfInput==="q"){state.mf.q=e.target.value;
    const grid=$("#view .mem-grid");const tmp=document.createElement("div");tmp.innerHTML=views.memories();
    grid.innerHTML=tmp.querySelector(".mem-grid").innerHTML;return}
});
/* ================= 主题 & 刷新 ================= */
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("os72-theme",t)}catch(e){}}
try{const st=localStorage.getItem("os72-theme");if(st)setTheme(st)}catch(e){}
$("#btn-theme").addEventListener("click",()=>{
  const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  setTheme(cur==="dark"?"light":"dark");toast(cur==="dark"?"已切到浅色":"已切到深色")});
$("#btn-refresh").addEventListener("click",()=>{render();toast("数据已刷新","ok","GET /api/v1/companies/c01/overview · 200 · application/json")});
$("#comp-sel").addEventListener("change",e=>{toast(e.target.selectedIndex===0?"已切回 ACME Labs":"示例原型仅含一家公司的数据")});
/* ================= boot ================= */
render();
</script>
